buildscript {
    ext {
        kotlin_version = '2.1.0'
        coroutinesVersion = '1.6.4'
        ok_http_version = '4.12.0'
        dashjVersion = '22.0.4'
        // Dash Platform Kotlin SDK (org.dashj:dash-sdk-android). Single source of
        // truth for both the dependency coordinate (wallet/build.gradle) and the
        // DASH_SDK_VERSION BuildConfig field shown on the About screen once the
        // cutover hands L1 ownership to the SDK.
        dashSdkVersion = '0.1.0-v41int17-SNAPSHOT'
        dppVersion = "4.0.0"
        hiltVersion = '2.53'
        hiltCompilerVersion = '1.2.0'
        hiltWorkVersion = '1.2.0'
        workRuntimeVersion='2.9.1'
        firebaseVersion = '32.1.1'
        roomVersion = '2.6.1'
        jetpackVersion = '1.8.0'
        appCompatVersion = '1.4.2'

        // Architecture
        lifecycleVersion = '2.5.1'
        navigationVersion = '2.6.0'
        datastoreVersion = "1.0.0"
        serializationVersion = '1.0.1'
        preferenceVersion = '1.2.0'

        // Utils
        slf4jVersion = '2.0.7'
        desugaringLibraryVersion = '1.1.5'

        // UI
        materialVersion = "1.6.1"
        browserVersion = "1.3.0"
        constrainLayoutVersion = '2.2.1'
        recyclerViewVersion = "1.2.1"
        glideVersion = '4.12.0'
        zxingVersion = '3.3.3' // Don't update. 3.3.3 is the maximum to support Android 6.x
        swipeRefreshLayoutVersion = '1.1.0'
        composeBom = '2024.03.00'
        composeTooling = '1.7.8'

        // Tests
        junitVersion = '4.13.2'
        testCoreVersion = '1.5.0'
        mockitoVersion = '4.0.0'
        espressoVersion = '3.4.0'
        coilVersion = '2.7.0'
        junitExtVersion = '1.1.3'
        coreTestingVersion = '2.1.0'
    }

    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2' // Crashlytics
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:11.3.1"
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.1.0-1.0.29' apply false
    id("org.jetbrains.kotlin.plugin.compose") version "$kotlin_version" apply false
}

// Credentials for the GitHub Packages Maven registry that hosts the pre-release
// Dash Platform Kotlin SDK (see the repository declaration below). GitHub Packages
// requires authentication for reads as well as writes.
//   CI     : GITHUB_ACTOR / GITHUB_TOKEN environment variables.
//   Local  : optional gpr.user / gpr.token in ~/.gradle/gradle.properties.
// Never commit a token; both sources are read at configuration time only.
def githubPackagesUser = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
def githubPackagesToken = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.token')

allprojects {
    repositories {
        mavenLocal()
        // org.dashj:dash-sdk-android pre-release snapshots are published to GitHub
        // Packages on dashpay/platform; they are deliberately not on Maven Central
        // until the SDK cutover ships. mavenLocal() above is declared first, so a
        // locally published SDK build still wins for local development, and this
        // repository is only consulted when the coordinate is not already in ~/.m2.
        // The content filter keeps every other dependency off this registry —
        // GitHub Packages answers unknown coordinates with 401/403, which would
        // otherwise turn unrelated lookups into hard resolution failures.
        // Declared only when credentials exist so a credential-less checkout keeps
        // building against ~/.m2.
        // The pre-release SDK AAR is published to THIS repo's own package
        // registry (publishing needs write on the destination repo, which
        // fork-based contributors do not have on dashpay/platform). The
        // package is public, so no credentials are required to read it —
        // CI resolves it with nothing configured. Credentials are still
        // honoured when present, for private-package scenarios.
        maven {
            name 'GitHubPackagesDashSdk'
            url 'https://maven.pkg.github.com/dashpay/dash-wallet'
            if (githubPackagesUser && githubPackagesToken) {
                credentials {
                    username = githubPackagesUser
                    password = githubPackagesToken
                }
            }
            content {
                includeModule('org.dashj', 'dash-sdk-android')
            }
        }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
        maven {
            name 'Central Portal Snapshots'
            url 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.recaptcha:recaptcha:18.4.0'
        }
    }
}