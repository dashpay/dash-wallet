plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'org.jlleitschuh.gradle.ktlint'
}

android {

    defaultConfig {
        compileSdk 35
        minSdkVersion 29
        targetSdkVersion 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        configureEach {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Shipped to consumers (the app) and applied when THEY minify — this
            // is where this module's keep rules belong.
            consumerProguardFiles 'proguard-rules.pro'
        }
        // NO minifyEnabled here. MO-995: this was the only module in the project
        // that minified its own library output, and R8 stripped Hilt's
        // `hilt_aggregated_deps.*` metadata out of the release classes jar
        // (measured: 5 entries in debug, 0 in release). That metadata is how the
        // APP module's Hilt processor discovers @AndroidEntryPoint classes in
        // library modules, so the generated FragmentCImpl did not implement
        // UpholdPortalFragment_GeneratedInjector and attaching the fragment
        // crashed with a ClassCastException — release builds only, which is why
        // it never appeared in development.
        //
        // The existing `-keep class org.dash.wallet.integrations.uphold.**` rule
        // does not help: hilt_aggregated_deps is a different package.
        //
        // Dropping it costs nothing. The app module already sets
        // minifyEnabled true (wallet/build.gradle, release), so every class here
        // is still shrunk and obfuscated in the final APK — once, at the app
        // level, with the whole program visible. Minifying a library separately
        // only removes metadata its consumers still need.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'org.dash.wallet.integrations.uphold'
}

hilt {
    enableAggregatingTask = true
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':common')

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'com.scottyab:secure-preferences-lib:0.1.7'
    implementation "org.slf4j:slf4j-api:$slf4jVersion"

    // UI / Architecture
    implementation "androidx.navigation:navigation-fragment-ktx:$navigationVersion"
    implementation "androidx.constraintlayout:constraintlayout:$constrainLayoutVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$swipeRefreshLayoutVersion"
    implementation "androidx.datastore:datastore-preferences:$datastoreVersion"

    // DI
    implementation "com.google.dagger:hilt-android:$hiltVersion"
    ksp "com.google.dagger:hilt-compiler:$hiltVersion"

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly('io.jsonwebtoken:jjwt-orgjson:0.11.5') {
        // On a device org.json comes from the platform, so it must not be packaged into the APK.
        // JVM unit tests are the exception — see the testImplementation below.
        exclude(group: 'org.json', module: 'json')
    }

    implementation 'com.madgag.spongycastle:core:1.50.0.0'
    implementation 'com.madgag.spongycastle:prov:1.50.0.0'
    implementation 'com.madgag.spongycastle:pkix:1.50.0.0'

    // Tests
    testImplementation "junit:junit:$junitVersion"
    testImplementation "androidx.test:core-ktx:1.5.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$mockitoVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$ok_http_version"
    // android.jar's org.json is a stub whose methods throw "not mocked" under JVM unit tests, so
    // UpholdApiException's error parsing needs a real implementation on the test classpath. This
    // used to arrive transitively via org.dashj:dashj-core (its POM pulls org.json:json at runtime
    // scope); dashj was removed from this module, so depend on it directly and explicitly.
    testImplementation 'org.json:json:20231013'

    androidTestImplementation("androidx.test.espresso:espresso-core:$espressoVersion", {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
