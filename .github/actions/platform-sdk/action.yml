name: Pinned Platform SDK
description: Build the exact Connect-capable SDK source into an isolated Maven repository
runs:
  using: composite
  steps:
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - name: Build pinned SDK
      shell: bash
      env:
        CARGO_BUILD_JOBS: '2'
      run: bash .github/scripts/build-platform-sdk.sh
