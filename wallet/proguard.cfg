# dash-sdk
-keep class org.dashj.platform.sdk.** { *; }

# Kotlin SDK send-all (drain) — Step B. Prod is minifyEnabled with
# -dontobfuscate/-dontoptimize but NOT -dontshrink, and the dash-sdk-android
# AAR's consumer rules only keep ffi.**, so R8's SHRINK step is live for
# these classes:
# - ManagedPlatformWallet's synthetic accessor access$getCoreSendMutex$p is
#   reached ONLY via reflection (DashSdkL1SendSource.coreSendMutexOf) — the
#   shrinker sees no static reference and would strip it, making the FIRST
#   post-cutover drain fail at runtime in prod only. Keep it by exact
#   signature (names survive because of -dontobfuscate).
-keepclassmembers class org.dashfoundation.dashsdk.wallet.ManagedPlatformWallet {
    kotlinx.coroutines.sync.Mutex access$getCoreSendMutex$p(org.dashfoundation.dashsdk.wallet.ManagedPlatformWallet);
}
# - the $sdk_release members CoreSendAllNative links ARE statically
#   referenced (javac bytecode), but keep them explicitly so a future
#   shrinker/consumer-rule interplay (or an -assumenosideeffects style rule
#   added later) can never remove the drain's builder surface silently.
#   Scoped to exactly the members the shim calls — no blanket keep.
-keepclassmembers class org.dashfoundation.dashsdk.wallet.CoreTransactionBuilder {
    *** addOutput$sdk_release(...);
    *** setSelectionStrategy$sdk_release(...);
    *** setFunding$sdk_release(...);
    *** buildSigned$sdk_release(...);
}

