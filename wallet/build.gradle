// ---------------------------------------------------------------------------
// Covariant java.nio buffer patch (fixes NoSuchMethodError crash on Android <= 15)
//
// dashj-core 22.x is compiled with a modern JDK without `--release 8`, so javac
// binds e.g. SPVBlockStore's `buffer.position(int)` call to the JDK-13 covariant
// override `MappedByteBuffer.position(I)Ljava/nio/MappedByteBuffer;`. Android's
// libcore does NOT declare the covariant java.nio buffer overrides up to and
// including API 35 (android.jar 35: MappedByteBuffer.position(int) still returns
// java.nio.Buffer), so on those devices ART throws
//   java.lang.NoSuchMethodError: No virtual method position(I)Ljava/nio/MappedByteBuffer;
// from SPVBlockStore.getChainHead, crash-looping BlockchainServiceImpl and
// killing sync on Android <= 15. Neither D8 (verified: 8.7.18 / 8.9.35 / 8.13.19)
// nor any desugar_jdk_libs release (verified: 1.1.5, 2.1.5, 2.1.5-nio) retargets
// these invokes, so we patch the dependency bytecode at build time instead.
//
// The transform rewrites, in every external jar on this module's classpaths,
//   invokevirtual java/nio/<TypedBuffer>.{position(I)|limit(I)|mark()|reset()|
//                                          clear()|flip()|rewind()} : L<TypedBuffer>;
// to the API-1 base declaration
//   invokevirtual java/nio/Buffer.<name> : Ljava/nio/Buffer;  +  checkcast <TypedBuffer>
// which is exactly the call shape javac emits with `--release 8`. Jars without
// matching call sites are passed through untouched.
// ---------------------------------------------------------------------------
@CacheableTransform
abstract class NioCovariantBufferPatch implements TransformAction<TransformParameters.None> {

    // Methods declared on java.nio.Buffer since API 1 that JDK 9/13 re-declared on
    // the typed buffer subclasses with covariant return types (absent on Android <= 15).
    private static final Map<String, String> RETARGETABLE_ARGS = [
        'position': '(I)',
        'limit'   : '(I)',
        'mark'    : '()',
        'reset'   : '()',
        'clear'   : '()',
        'flip'    : '()',
        'rewind'  : '()',
    ]

    private static final Set<String> TYPED_NIO_BUFFERS = [
        'java/nio/MappedByteBuffer',
        'java/nio/ByteBuffer',
        'java/nio/CharBuffer',
        'java/nio/DoubleBuffer',
        'java/nio/FloatBuffer',
        'java/nio/IntBuffer',
        'java/nio/LongBuffer',
        'java/nio/ShortBuffer',
    ] as Set

    @Classpath
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        File input = inputArtifact.get().asFile
        // Never touch Android platform/bootstrap jars - they legitimately contain
        // (and define) the java.nio classes themselves.
        boolean platformJar = input.name == 'android.jar' ||
            input.name.startsWith('core-for-system-modules') ||
            input.name.startsWith('core-lambda-stubs')
        if (!input.isFile() || !input.name.endsWith('.jar') || platformJar) {
            outputs.file(input)
            return
        }

        // First pass: read entries, patching classes that contain covariant calls.
        Map<String, byte[]> patchedEntries = [:]
        List<String> rewrites = []
        new ZipFile(input).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory || !entry.name.endsWith('.class') ||
                        entry.name.startsWith('java/') || entry.name.startsWith('javax/')) {
                    return
                }
                byte[] bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                // Cheap pre-filter: the constant pool must name a typed buffer class.
                String haystack = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (!TYPED_NIO_BUFFERS.any { haystack.contains(it) }) {
                    return
                }
                try {
                    byte[] patched = rewriteClass(bytes, entry.name, rewrites)
                    if (patched != null) {
                        patchedEntries[entry.name] = patched
                    }
                } catch (Throwable t) {
                    // Unparseable class (exotic version etc.) - leave it untouched.
                    System.err.println("NioCovariantBufferPatch: skipped ${input.name}!${entry.name}: $t")
                }
            }
        }

        if (patchedEntries.isEmpty()) {
            outputs.file(input)
            return
        }

        System.out.println(
            "NioCovariantBufferPatch: patched ${rewrites.size()} covariant java.nio call site(s) " +
            "in ${input.name}: ${rewrites.toSorted().toUnique().join(', ')}"
        )

        // Second pass: copy the jar, substituting patched classes and dropping any
        // now-stale signature files.
        File outFile = outputs.file(input.name)
        Set<String> seen = []
        new ZipFile(input).withCloseable { zip ->
            new ZipOutputStream(outFile.newOutputStream()).withCloseable { zos ->
                zip.entries().each { entry ->
                    String name = entry.name
                    if (!seen.add(name)) {
                        return // malformed duplicate entry
                    }
                    if (name ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/) {
                        return // signature invalidated by patching
                    }
                    ZipEntry out = new ZipEntry(name)
                    out.time = entry.time
                    zos.putNextEntry(out)
                    if (!entry.directory) {
                        byte[] bytes = patchedEntries[name] ?: zip.getInputStream(entry).withCloseable { it.bytes }
                        zos.write(bytes)
                    }
                    zos.closeEntry()
                }
            }
        }
    }

    /**
     * Returns patched class bytes, or null if the class has no covariant buffer calls.
     * Not private: Gradle instantiates a decorated subclass, and Groovy's dynamic
     * dispatch from the closure inside transform() cannot reach private members of
     * the base class through it.
     */
    protected static byte[] rewriteClass(byte[] classBytes, String entryName, List<String> rewrites) {
        ClassReader reader = new ClassReader(classBytes)
        ClassWriter writer = new ClassWriter(reader, 0)
        boolean[] changed = [false]
        ClassVisitor visitor = new ClassVisitor(Opcodes.ASM9, writer) {
            @Override
            MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String owner, String mName, String mDesc, boolean isInterface) {
                        String args = RETARGETABLE_ARGS[mName]
                        if (opcode == Opcodes.INVOKEVIRTUAL && !isInterface && args != null &&
                                TYPED_NIO_BUFFERS.contains(owner) && mDesc == "${args}L${owner};") {
                            // e.g. MappedByteBuffer.position(I)LMappedByteBuffer;
                            //   -> Buffer.position(I)LBuffer; + checkcast MappedByteBuffer
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, 'java/nio/Buffer', mName,
                                "${args}Ljava/nio/Buffer;", false)
                            super.visitTypeInsn(Opcodes.CHECKCAST, owner)
                            changed[0] = true
                            rewrites.add("${entryName}: ${owner.substring(owner.lastIndexOf('/') + 1)}.${mName}${args}".toString())
                            return
                        }
                        super.visitMethodInsn(opcode, owner, mName, mDesc, isInterface)
                    }
                }
            }
        }
        reader.accept(visitor, 0)
        return changed[0] ? writer.toByteArray() : null
    }
}

def nioCovariantPatched = Attribute.of('nioCovariantBufferPatched', Boolean)

dependencies {
    attributesSchema {
        attribute(nioCovariantPatched)
    }
    artifactTypes {
        jar {
            attributes.attribute(nioCovariantPatched, false)
        }
    }
    registerTransform(NioCovariantBufferPatch) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
            .attribute(nioCovariantPatched, false)
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
            .attribute(nioCovariantPatched, true)
    }
}

configurations.configureEach { conf ->
    if (conf.canBeResolved) {
        conf.attributes.attribute(nioCovariantPatched, true)
    }
}

